# argus built-in model catalog.
#
# A profile says what argus needs to know about a model beyond its id: context
# window, per-turn output cap, tool-call protocol, thinking format, quirks and
# pricing (USD per million tokens). The profile whose `match` pattern fits the
# model id best is applied to every config key the user did not set.
#
# This is data, not code, and it dates quickly: override any field in
# ~/.config/argus/models.toml (same table layout), let `argus tune MODEL` write
# the protocol that works best, and check prices against the provider.
#
# Anthropic prices: platform price list as of 2026-06. OpenAI and Gemini
# prices: as of late 2025, verify before relying on cost reports.
#
# Fields: match, provider, base_url, model, context_window, max_output,
# protocol, thinking, effort, thinking_budget, enable_thinking, sampling,
# quirks, chat_template_kwargs, pricing, compaction_model, tier, notes.
# thinking formats: adaptive | budget | none (anthropic), openai (effort),
# gemini_budget | gemini_level, qwen (chat_template enable_thinking).

# -- Anthropic ----------------------------------------------------------------------------

[profiles.claude-fable-5-1]
match = ["claude-fable-5-1*", "claude-mythos-5-1*"]
provider = "anthropic"
context_window = 1_000_000
max_output = 64000
protocol = "native"
thinking = "adaptive"
effort = "xhigh"
quirks = ["no_sampling", "thinking_always_on", "no_forced_tool_choice"]
pricing = { input = 10.0, output = 50.0, cache_read = 0.25, cache_write = 12.5 }
compaction_model = "claude-haiku-4-5"
tier = "frontier"

