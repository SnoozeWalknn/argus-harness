# -- Local models (llama-server, Ollama, vLLM, LM Studio) --------------------------------------
# No provider: they apply on whichever OpenAI-compatible server serves them.
# The context window comes from the server when it can say (/props, /api/show, ...).

[profiles.qwen3-coder]
match = ["qwen3-coder*", "*qwen3-coder*", "*Qwen3-Coder*"]
protocol = "grammar"
max_output = 8192
sampling = { temperature = 0.7, top_p = 0.8, top_k = 20, repeat_penalty = 1.05 }
tier = "local"
notes = "no thinking mode; grammar protocol keeps the prompt small"

[profiles.qwen3]
match = ["qwen3*", "*Qwen3*", "*qwen3*"]
protocol = "grammar"
max_output = 8192
thinking = "qwen"
sampling = { temperature = 0.6, top_p = 0.95, top_k = 20, min_p = 0.0 }
tier = "local"

[profiles.gpt-oss]
match = ["gpt-oss*", "*gpt-oss*"]
protocol = "native"        # harmony channels; argus's grammar would fight the template
max_output = 16384
effort = "medium"
sampling = { temperature = 1.0, top_p = 1.0 }
tier = "local"

[profiles.devstral]
match = ["*devstral*", "*Devstral*"]
protocol = "native"
max_output = 8192
sampling = { temperature = 0.15 }
tier = "local"

[profiles.glm]
match = ["glm-4*", "*GLM-4*", "*glm-4*"]
protocol = "native"
max_output = 8192
thinking = "qwen"
tier = "local"

[profiles.deepseek]
match = ["deepseek*", "*DeepSeek*"]
protocol = "native"
max_output = 8192
tier = "local"
