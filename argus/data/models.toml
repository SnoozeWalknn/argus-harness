# -- Gemini ----------------------------------------------------------------------------------

[profiles.gemini-3-pro]
match = ["gemini-3*"]
provider = "gemini"
context_window = 1_048_576
max_output = 65536
protocol = "native"
thinking = "gemini_level"
quirks = ["no_sampling", "thought_signatures"]   # keep the default temperature of 1.0
pricing = { input = 2.0, output = 12.0, cache_read = 0.2 }   # prompts up to 200k tokens
compaction_model = "gemini-2.5-flash"
tier = "frontier"

[profiles.gemini-2-5-pro]
match = ["gemini-2.5-pro*"]
provider = "gemini"
context_window = 1_048_576
max_output = 65536
protocol = "native"
thinking = "gemini_budget"
pricing = { input = 1.25, output = 10.0, cache_read = 0.31 }  # prompts up to 200k tokens
compaction_model = "gemini-2.5-flash"
tier = "frontier"

[profiles.gemini-2-5-flash]
