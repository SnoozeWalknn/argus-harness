# -- OpenAI (Responses API) ------------------------------------------------------------------

[profiles.gpt-5]
match = ["gpt-5", "gpt-5-2*", "gpt-5-codex*", "gpt-5.*"]
provider = "openai"
context_window = 272_000   # input limit; 400k including output
max_output = 64000
protocol = "native"
