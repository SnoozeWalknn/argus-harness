[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-harness"
version = "0.2.0"
description = "Model-agnostic headless coding agent and measurement harness, with a terminal UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
tui = ["textual>=0.86"]
dev = ["pytest>=8", "ruff>=0.5", "textual>=0.86", "python-lsp-server[pyflakes]>=1.12"]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
"argus.data" = ["*.toml", "tune/**/*"]
"argus.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B027", "SIM105", "SIM108"]
